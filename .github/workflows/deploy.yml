name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bogdanripa/smartbill-mcp:latest
            ghcr.io/bogdanripa/smartbill-mcp:${{ steps.tag.outputs.value }}

      # No secret: the box watches :latest and redeploys the new image.
      # This just asks it to do so now instead of at the next hourly poll.
      - name: Trigger deploy on the Pi
        run: |
          curl -fsS -X POST \
            "https://api-coolify.bogdanripa.com/apps/smartbill-mcp/refresh"
