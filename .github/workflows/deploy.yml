name: deploy
on:
  push:
    branches: [main]
  # Lets the deployment be re-verified without a commit.
  workflow_dispatch:

# Every run pushes the same `:latest` tag, and the box deploys whatever `:latest`
# points at. Two overlapping runs therefore race, and the one that finishes last
# wins regardless of which commit is newer — an arm64 build takes ~15 minutes
# under QEMU, so a quick follow-up commit can easily finish first and be undone
# by its predecessor. Serialise on the branch and drop superseded runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The marketing homepage is a static site served by the platform's CDN — no
  # container, no cold start. Uploaded on every push; publishes in about a second.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the static site
        run: cd web && zip -qr ../site.zip .
      - name: Upload the frontend
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ secrets.PAAS_KEY }}" \
            --data-binary @site.zip \
            "https://api-coolify.bogdanripa.com/apps/smartbill-mcp/frontend"

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/bogdanripa/smartbill-mcp:latest
            ghcr.io/bogdanripa/smartbill-mcp:${{ steps.tag.outputs.value }}

      # The box watches :latest and redeploys the new image; this asks it to do
      # so now instead of at the next hourly poll. Authenticates with this app's
      # scoped deploy key (PAAS_KEY), which can only redeploy this one app.
      - name: Trigger deploy on the Pi
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PAAS_KEY }}" \
            "https://api-coolify.bogdanripa.com/apps/smartbill-mcp/refresh"

  # The deploy above only asks the Pi to pull; it says nothing about whether the
  # container then came up. This does, and its log is the only window into the
  # running app for anyone who cannot reach the host directly.
  smoke:
    needs: [deploy, frontend]
    runs-on: ubuntu-latest
    steps:
      # Waiting for a 200 is not enough: during a redeploy the OUTGOING container
      # is still serving, so /health answers immediately and the steps below then
      # race a half-started container. /health reports the commit it was built
      # from, so wait for THIS one.
      - name: Wait for the new container to serve /health
        id: health
        run: |
          URL=https://smartbill-mcp-coolify.bogdanripa.com
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$URL/health" || echo 000)
            SEEN=$(sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' /tmp/body)
            echo "attempt $i: GET /health -> $CODE commit=${SEEN:-none} (want ${GITHUB_SHA})"
            if [ "$CODE" = "200" ] && [ "$SEEN" = "$GITHUB_SHA" ]; then
              echo "ok=true" >> $GITHUB_OUTPUT; exit 0
            fi
            sleep 10
          done
          echo "::error::/health never reported commit ${GITHUB_SHA}. The new container is not serving."
          echo "Last response body:"; cat /tmp/body; echo
          exit 1

      - name: Homepage renders for a browser
        run: |
          URL=https://smartbill-mcp-coolify.bogdanripa.com
          CODE=$(curl -s -o /tmp/page -w '%{http_code}' -H 'Accept: text/html' --max-time 15 "$URL/")
          TYPE=$(curl -s -o /dev/null -w '%{content_type}' -H 'Accept: text/html' --max-time 15 "$URL/")
          echo "GET / -> $CODE ($TYPE)"
          test "$CODE" = "200" || { echo "::error::root returned $CODE"; head -c 500 /tmp/page; exit 1; }
          grep -q "SmartBill MCP" /tmp/page || { echo "::error::homepage missing"; exit 1; }
          grep -q "Add custom connector" /tmp/page || { echo "::error::connect instructions missing"; exit 1; }

      - name: OAuth discovery metadata is served
        run: |
          URL=https://smartbill-mcp-coolify.bogdanripa.com
          CODE=$(curl -s -o /tmp/asm -w '%{http_code}' --max-time 15 "$URL/.well-known/oauth-authorization-server")
          echo "GET /.well-known/oauth-authorization-server -> $CODE"; head -c 300 /tmp/asm; echo
          test "$CODE" = "200" || { echo "::error::AS metadata returned $CODE"; exit 1; }
          grep -q '"authorization_endpoint"' /tmp/asm || { echo "::error::no authorization_endpoint"; exit 1; }
          RS=$(curl -s -o /tmp/rsm -w '%{http_code}' --max-time 15 "$URL/.well-known/oauth-protected-resource")
          echo "GET /.well-known/oauth-protected-resource -> $RS"; head -c 300 /tmp/rsm; echo
          test "$RS" = "200" || { echo "::error::PRM returned $RS"; exit 1; }

      - name: Unauthenticated MCP request is challenged
        run: |
          URL=https://smartbill-mcp-coolify.bogdanripa.com
          CODE=$(curl -s -D /tmp/hdr -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$URL/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "POST /mcp with no token -> $CODE"
          test "$CODE" = "401" || { echo "::error::expected 401, got $CODE"; exit 1; }
          grep -iq 'www-authenticate' /tmp/hdr || { echo "::error::missing WWW-Authenticate challenge"; exit 1; }
